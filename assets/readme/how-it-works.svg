<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">How Infinite Resume for Claude works</title>
  <desc id="desc">Four steps: write the resume in Claude, approve the complete draft, Claude sends it over a secure one-time link, then choose a template, edit and download the PDF on Infinite Resume.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112e"/>
      <stop offset="1" stop-color="#1f1240"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#e11d74"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .h { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .s { font-size: 13px; fill: #c7c3f5; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #a5b4fc; }
      .head { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .disc { fill: #221a4a; stroke: #3b2f78; stroke-width: 2; }
      .ink { fill: none; stroke: #e0e7ff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="960" height="340" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="338" rx="23" fill="none" stroke="#2e2563"/>

  <text class="t tag" x="48" y="52">HOW IT WORKS</text>
  <text class="t head" x="48" y="82">From a conversation in Claude to a finished, downloadable resume</text>

  <!-- the track -->
  <line x1="150" y1="170" x2="810" y2="170" stroke="#3b2f78" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="170" x2="810" y2="170" stroke="url(#brand)" stroke-width="4" stroke-linecap="round" stroke-dasharray="660" stroke-dashoffset="660">
    <animate attributeName="stroke-dashoffset" values="660;660;440;440;220;220;0;0;660" keyTimes="0;0.1;0.25;0.35;0.5;0.6;0.75;0.97;1" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- the resume travelling along the track -->
  <g>
    <circle r="22" fill="url(#glow)"/>
    <circle r="7" fill="#f0abfc"/>
    <animateMotion path="M150,170 H810" keyPoints="0;0;0.3333;0.3333;0.6667;0.6667;1;1" keyTimes="0;0.1;0.25;0.35;0.5;0.6;0.75;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- 1. Write it in Claude -->
  <g transform="translate(150 170)">
    <circle r="50" fill="none" stroke="url(#brand)" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.12;0.2;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="44" class="disc"/>
    <path class="ink" d="M-20,-14 h40 a6,6 0 0 1 6,6 v18 a6,6 0 0 1 -6,6 h-24 l-10,9 v-9 h-6 a6,6 0 0 1 -6,-6 v-18 a6,6 0 0 1 6,-6 z"/>
    <circle cx="-9" cy="1" r="2.6" fill="#e0e7ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="1" r="2.6" fill="#e0e7ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="9" cy="1" r="2.6" fill="#e0e7ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>
  <text class="t h" x="150" y="252" text-anchor="middle">Write it in Claude</text>
  <text class="t s" x="150" y="274" text-anchor="middle">Guided questions, factual wording</text>

  <!-- 2. Approve the draft -->
  <g transform="translate(370 170)">
    <circle r="50" fill="none" stroke="url(#brand)" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.37;0.45;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="44" class="disc"/>
    <rect class="ink" x="-15" y="-21" width="30" height="40" rx="4"/>
    <path class="ink" d="M-8,-11 h16 M-8,-4 h16 M-8,3 h9"/>
    <circle cx="13" cy="14" r="11" fill="#22c55e" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.15;1;1;0.15" keyTimes="0;0.26;0.3;0.97;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <path d="M8,14 l4,4 l7,-8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18" stroke-dashoffset="18">
      <animate attributeName="stroke-dashoffset" values="18;18;0;0;18" keyTimes="0;0.27;0.32;0.97;1" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <text class="t h" x="370" y="252" text-anchor="middle">Approve the draft</text>
  <text class="t s" x="370" y="274" text-anchor="middle">Nothing is sent until you say so</text>

  <!-- 3. Secure one-time link -->
  <g transform="translate(590 170)">
    <circle r="50" fill="none" stroke="url(#brand)" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.62;0.7;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="44" class="disc"/>
    <rect x="-15" y="-4" width="30" height="24" rx="5" fill="none" stroke="#e0e7ff" stroke-width="2.5"/>
    <circle cx="0" cy="6" r="3" fill="#e0e7ff"/>
    <path class="ink" d="M-9,-4 v-8 a9,9 0 0 1 18,0 v8">
      <animateTransform attributeName="transform" type="translate" values="0 -7;0 -7;0 0;0 0;0 -7" keyTimes="0;0.5;0.54;0.97;1" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <text class="t h" x="590" y="252" text-anchor="middle">Secure one-time link</text>
  <text class="t s" x="590" y="274" text-anchor="middle">Opens for your account only</text>

  <!-- 4. Design and download -->
  <g transform="translate(810 170)">
    <circle r="50" fill="none" stroke="url(#brand)" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.76;0.97;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="44" class="disc"/>
    <rect x="-20" y="-20" width="24" height="32" rx="3" fill="#4f46e5" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-4 -3;-4 -3;0 0" keyTimes="0;0.76;0.82;0.97;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-10" y="-16" width="24" height="32" rx="3" fill="#9333ea" opacity="0.85"/>
    <rect x="0" y="-12" width="24" height="32" rx="3" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;4 3;4 3;0 0" keyTimes="0;0.76;0.82;0.97;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <path d="M5,-5 h14 M5,1 h14 M5,7 h9" stroke="#9333ea" stroke-width="2" stroke-linecap="round"/>
    <rect x="-24" y="18" width="30" height="14" rx="4" fill="#e11d74">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.84;0.97;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text class="t" x="-9" y="28.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff" opacity="0">PDF
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.84;0.97;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
  <text class="t h" x="810" y="252" text-anchor="middle">Design &amp; download</text>
  <text class="t s" x="810" y="274" text-anchor="middle">50+ templates, unlimited PDFs</text>

  <text class="t s" x="480" y="314" text-anchor="middle" opacity="0.8">Free to use · every template free · watermark-free PDF downloads</text>
</svg>
